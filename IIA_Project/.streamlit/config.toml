# Theme of record: "Visibility" — cool ink ground, one beacon accent (#E4572E), dark ink.
# The colour tokens and the type scale live in app/theme.py (inject()); this file is what
# Streamlit's own chrome reads, so the two must agree — ground #F3F4F6, plate #FCFCFA,
# ink #14213D, accent #E4572E.
#
# Streamlit's own base is pinned to light on purpose: our banners and chips are tinted light
# surfaces with dark text, and app/theme.py repaints OUR surfaces for a dark-mode viewer
# itself (@media prefers-color-scheme). Pinning keeps baseweb internals (menus, dataframe
# chrome, alerts) legible on every laptop and on the projector.
[theme]
base = "light"
primaryColor = "#E4572E"
backgroundColor = "#F3F4F6"
secondaryBackgroundColor = "#FCFCFA"
textColor = "#14213D"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
