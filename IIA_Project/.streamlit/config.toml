# Theme of record: "Civic" — light grey ground, white panels, near-black ink, one green action
# colour. The tokens and the type scale live in app/theme.py (inject()); this file is what
# Streamlit's own chrome reads, so the two must agree.
#
# `base = "light"` is not optional. Without it Streamlit follows the viewer's operating system,
# and an operator whose laptop is in dark mode gets Streamlit's dark chrome underneath our light
# stylesheet: dark tab labels on dark ground, white dataframes glaring on navy. The page is
# light on every machine, projector included, by construction.
[theme]
base = "light"
primaryColor = "#00703C"
backgroundColor = "#F3F4F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B0C0C"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
