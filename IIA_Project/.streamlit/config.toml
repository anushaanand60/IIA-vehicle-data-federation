# Theme of record: warm paper ground, one indigo accent, dark ink. The colour tokens and the
# type scale live in app/theme.py (inject()); this file is what Streamlit's own chrome reads,
# so the two must agree — paper #FBFAF7, secondary #F2EFE8, ink #1F2937, accent #4338CA.
#
# The theme is pinned to light on purpose. Our banners and chips are tinted light surfaces with
# dark text; in dark mode Streamlit would paint its own text near-white and every banner would
# read white-on-pale. Pinning keeps the page identical on every laptop and on the projector,
# whatever each machine's Windows dark-mode setting happens to be.
[theme]
base = "light"
primaryColor = "#4338CA"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F2EFE8"
textColor = "#1F2937"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
